<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تصفح الدورات - أكاديميتي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="home.html"><i class="bi bi-book-half"></i> أكاديميتي</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="home.html">الرئيسية</a></li>
                    <li class="nav-item"><a class="nav-link active" href="courses.html">الدورات</a></li>
                </ul>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-secondary" id="darkModeToggle"><i class="bi bi-moon"></i></button>
                    <a href="login.html" class="btn btn-outline-primary">تسجيل الدخول</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row mb-4 align-items-center">
            <div class="col-md-6 mb-3 mb-md-0">
                <h2 class="fw-bold">جميع الدورات</h2>
            </div>
            <div class="col-md-6">
                <div class="d-flex gap-2">
                    <input type="text" class="form-control" placeholder="ابحث عن دورة...">
                    <select class="form-select w-auto">
                        <option>كل التصنيفات</option>
                        <option>برمجة</option>
                        <option>تصميم</option>
                    </select>
                    <button class="btn btn-primary"><i class="bi bi-search"></i></button>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-6 col-lg-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-img-top bg-secondary text-white d-flex align-items-center justify-content-center" style="height: 200px;">صورة الدورة</div>
                    <div class="card-body">
                        <span class="badge bg-primary mb-2">برمجة</span>
                        <h5 class="card-title fw-bold">دورة الجافاسكريبت المتقدمة</h5>
                        <p class="text-muted small">المدرب: ياسر عبد الله</p>
                        <h6 class="text-primary fw-bold">$40.00</h6>
                    </div>
                    <div class="card-footer bg-white">
                        <a href="course-details.html" class="btn btn-outline-primary w-100">التفاصيل</a>
                    </div>
                </div>
            </div>
            <div class="col-md-6 col-lg-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-img-top bg-secondary text-white d-flex align-items-center justify-content-center" style="height: 200px;">صورة الدورة</div>
                    <div class="card-body">
                        <span class="badge bg-danger mb-2">تصميم</span>
                        <h5 class="card-title fw-bold">احتراف الفوتوشوب</h5>
                        <p class="text-muted small">المدرب: نورة حسن</p>
                        <h6 class="text-primary fw-bold">$35.00</h6>
                    </div>
                    <div class="card-footer bg-white">
                        <a href="course-details.html" class="btn btn-outline-primary w-100">التفاصيل</a>
                    </div>
                </div>
            </div>
        </div>

        <nav class="mt-5">
            <ul class="pagination justify-content-center">
                <li class="page-item disabled"><a class="page-link" href="#">السابق</a></li>
                <li class="page-item active"><a class="page-link" href="#">1</a></li>
                <li class="page-item"><a class="page-link" href="#">2</a></li>
                <li class="page-item"><a class="page-link" href="#">التالي</a></li>
            </ul>
        </nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
</body>
</html>
