<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي - أكاديميتي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<div class="sidebar p-3 shadow-sm" id="sidebar">
    <div class="sidebar-header text-center mb-4 border-bottom pb-3">
        <h4 class="fw-bold text-primary mb-0">
            <i class="bi bi-book-half"></i> أكاديميتي
        </h4>
    </div>
    
<ul class="nav flex-column">
    <li class="nav-item mb-2">
        <a href="dashboard.html" class="nav-link text-dark">
            <i class="bi bi-speedometer2 me-2"></i> لوحة التحكم
        </a>
    </li>
    <li class="nav-item mb-2">
        <a href="my-courses.html" class="nav-link text-dark">
            <i class="bi bi-collection-play me-2"></i> دوراتي
        </a>
    </li>
    <li class="nav-item mb-2">
        <a href="chat.html" class="nav-link text-dark">
            <i class="bi bi-chat-dots me-2"></i> الدردشة
        </a>
    </li>
    <li class="nav-item mb-2">
        <a href="profile.html" class="nav-link rounded px-3 py-2 text-dark">
            <i class="bi bi-person me-2"></i> الملف الشخصي
        </a>
    </li>
</ul>
    
    <div class="sidebar-footer mt-auto pt-3">
        <hr>
        <a href="../pages/login.html" class="btn btn-outline-danger w-100 d-flex align-items-center justify-content-center border-0 shadow-none">
            <i class="bi bi-box-arrow-right me-2"></i> تسجيل الخروج
        </a>
    </div>
</div>

    <div class="main-content">
        <nav class="navbar navbar-light bg-white border-bottom px-4 py-3 sticky-top">
            <div class="container-fluid d-flex justify-content-between align-items-center">
                <button class="btn btn-light d-lg-none" id="sidebarToggle"><i class="bi bi-list fs-4"></i></button>
                <h5 class="fw-bold mb-0">تعديل الملف الشخصي</h5>
                <button class="btn btn-light rounded-circle" id="darkModeToggle"><i class="bi bi-moon"></i></button>
            </div>
        </nav>

        <div class="container-fluid p-4">
            <div class="row g-4">
                
                <div class="col-lg-4">
                    <div class="card shadow-sm border-0 text-center p-4">
                        <div class="position-relative d-inline-block mx-auto mb-3">
                            <img src="https://via.placeholder.com/150" class="rounded-circle border p-1" alt="Profile" id="profileImagePreview" style="width: 150px; height: 150px; object-fit: cover;">
                            <label for="uploadImage" class="btn btn-primary btn-sm position-absolute bottom-0 start-0 rounded-circle">
                                <i class="bi bi-camera"></i>
                            </label>
                            <input type="file" id="uploadImage" class="d-none" accept="image/*">
                        </div>
                        <h5 class="fw-bold mb-1">مو صابر</h5>
                        <p class="text-muted small">طالب في أكاديميتي</p>
                        <hr>
                        <div class="text-end">
                            <p class="small mb-1"><strong>تاريخ الانضمام:</strong> 12 يناير 2026</p>
                            <p class="small mb-0"><strong>الدورات المكتملة:</strong> 2</p>
                        </div>
                    </div>
                </div>

                <div class="col-lg-8">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-white py-3">
                            <h6 class="fw-bold mb-0">بيانات الحساب</h6>
                        </div>
                        <div class="card-body">
                            <form class="needs-validation" novalidate id="profileForm">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label">الاسم الأول</label>
                                        <input type="text" class="form-control" value="مو" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">اسم العائلة</label>
                                        <input type="text" class="form-control" value="صابر" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">البريد الإلكتروني</label>
                                        <input type="email" class="form-control" value="mo@example.com" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">رقم الهاتف</label>
                                        <input type="tel" class="form-control" placeholder="01xxxxxxxxx">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">نبذة تعريفية</label>
                                        <textarea class="form-control" rows="3" placeholder="تحدث عن نفسك قليلاً..."></textarea>
                                    </div>
                                    
                                    <hr class="my-4">
                                    <h6 class="fw-bold mb-2 text-danger">تغيير كلمة المرور</h6>
                                    
                                    <div class="col-md-6">
                                        <label class="form-label">كلمة المرور الحالية</label>
                                        <input type="password" class="form-control">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">كلمة المرور الجديدة</label>
                                        <input type="password" class="form-control">
                                    </div>

                                    <div class="col-12 mt-4">
                                        <button type="submit" class="btn btn-primary px-5">حفظ التغييرات</button>
                                        <button type="reset" class="btn btn-outline-secondary px-4 ms-2">إلغاء</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container position-fixed bottom-0 start-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>

</body>
</html>
