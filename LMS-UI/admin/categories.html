<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التصنيفات - لوحة التحكم</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <div class="sidebar p-3" id="sidebar">
        <h4 class="fw-bold text-primary text-center mb-4"><i class="bi bi-shield-lock"></i> الإدارة</h4>
        <ul class="nav flex-column">
            <li class="nav-item mb-2"><a href="dashboard.html" class="nav-link text-dark"><i class="bi bi-speedometer2 me-2"></i> لوحة التحكم</a></li>
            <li class="nav-item mb-2"><a href="users.html" class="nav-link text-dark"><i class="bi bi-people me-2"></i> إدارة المستخدمين</a></li>
            <li class="nav-item mb-2"><a href="courses.html" class="nav-link text-dark"><i class="bi bi-journal-text me-2"></i> إدارة الدورات</a></li>
            <li class="nav-item mb-2"><a href="categories.html" class="nav-link text-dark"><i class="bi bi-tags me-2"></i> التصنيفات</a></li>
            <li class="nav-item mb-2"><a href="orders.html" class="nav-link text-dark"><i class="bi bi-cart me-2"></i> الطلبات</a></li>
        </ul>
        <hr>
        <a href="../pages/login.html" class="btn btn-outline-danger w-100"><i class="bi bi-box-arrow-right me-2"></i> خروج</a>
    </div>
    <div class="main-content p-4">
        <div class="row">
            <div class="col-md-4">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-white fw-bold">إضافة تصنيف جديد</div>
                    <div class="card-body">
                        <form id="categoryForm">
                            <div class="mb-3">
                                <label class="form-label small">اسم التصنيف</label>
                                <input type="text" class="form-control" placeholder="مثلاً: برمجة الويب">
                            </div>
                            <div class="mb-3">
                                <label class="form-label small">الأيقونة (Bootstrap Icon)</label>
                                <input type="text" class="form-control" placeholder="bi-code-slash">
                            </div>
                            <button type="submit" class="btn btn-primary w-100">حفظ التصنيف</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-0">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="px-4">الأيقونة</th>
                                    <th>اسم التصنيف</th>
                                    <th>عدد الدورات</th>
                                    <th class="text-center">إجراءات</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td class="px-4"><i class="bi bi-code-slash fs-4 text-primary"></i></td>
                                    <td class="fw-bold">برمجة الويب</td>
                                    <td>12 دورة</td>
                                    <td class="text-center">
                                        <button class="btn btn-sm btn-outline-danger border-0" onclick="deleteItem()"><i class="bi bi-trash"></i></button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
</body>
</html>
