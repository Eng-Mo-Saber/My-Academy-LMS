<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-light">
        <div class="sidebar p-3" id="sidebar">
        <h4 class="fw-bold text-primary text-center mb-4"><i class="bi bi-shield-lock"></i> الإدارة</h4>
        <ul class="nav flex-column">
            <li class="nav-item mb-2"><a href="dashboard.html" class="nav-link text-dark"><i class="bi bi-speedometer2 me-2"></i> لوحة التحكم</a></li>
            <li class="nav-item mb-2"><a href="users.html" class="nav-link text-dark"><i class="bi bi-people me-2"></i> إدارة المستخدمين</a></li>
            <li class="nav-item mb-2"><a href="courses.html" class="nav-link text-dark"><i class="bi bi-journal-text me-2"></i> إدارة الدورات</a></li>
            <li class="nav-item mb-2"><a href="categories.html" class="nav-link text-dark"><i class="bi bi-tags me-2"></i> التصنيفات</a></li>
            <li class="nav-item mb-2"><a href="orders.html" class="nav-link text-dark"><i class="bi bi-cart me-2"></i> الطلبات</a></li>
        </ul>
        <hr>
        <a href="../pages/login.html" class="btn btn-outline-danger w-100"><i class="bi bi-box-arrow-right me-2"></i> خروج</a>
    </div>

<div class="main-content p-4">
    <form id="addCourseForm">
        <div class="row g-4">
            
            <div class="col-lg-8">
                <div class="card shadow-sm border-0 p-4 mb-4">
                    <label class="form-label fw-bold">عنوان الدورة</label>
                    <input type="text" class="form-control mb-3" placeholder="تعلم Laravel">
                    
                    <label class="form-label fw-bold">وصف الدورة</label>
                    <textarea class="form-control" rows="5"></textarea>
                </div>

                <div class="card shadow-sm border-0 p-4">
                    <h6 class="fw-bold mb-3">ماذا سيتعلم الطالب؟</h6>
                    <textarea class="form-control" rows="4"></textarea>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card shadow-sm border-0 p-4 mb-4 text-center">
                    <label class="form-label fw-bold d-block text-start">صورة الدورة</label>
                    <input type="file" id="courseImg" class="form-control">
                    <img id="imgPreview" class="img-fluid rounded mt-3 d-none" style="max-height: 150px;">
                </div>

                <div class="card shadow-sm border-0 p-4 mb-4">
                    <label class="form-label fw-bold">السعر (EGP)</label>
                    <div class="input-group mb-3">
                        <input type="number" class="form-control" placeholder="0.00">
                        <span class="input-group-text">ج.م</span>
                    </div>
                    
                    <label class="form-label fw-bold">السعر بعد الخصم</label>
                    <input type="number" class="form-control mb-3" placeholder="0.00">

                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="isFree">
                        <label class="form-check-label" for="isFree">دورة مجانية</label>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow">
                    <i class="bi bi-cloud-arrow-up me-1"></i> نشر الدورة الآن
                </button>
            </div>

        </div> </form>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
</body>
</html>
