<!DOCTYPE html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>إدارة الدروس</title>
        <link rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
        <link rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
        <link rel="stylesheet" href="../assets/css/style.css">
    </head>
    <body class="bg-light">
        <div class="sidebar shadow-sm" id="sidebar">
            <div class="p-4 border-bottom text-center">
                <h5 class="fw-bold mb-0 text-primary">لوحة المدرب</h5>
            </div>
            <div class="p-3">
                <ul class="nav flex-column" id="sidebarNav">
                    <li class="nav-item mb-2"><a href="dashboard.html"
                            class="nav-link text-dark"><i
                                class="bi bi-grid-1x2 me-2"></i>
                            الإحصائيات</a></li>
                    <li class="nav-item mb-2"><a href="create-course.html"
                            class="nav-link text-dark"><i
                                class="bi bi-plus-square me-2"></i> إنشاء
                            دورة</a></li>
                    <li class="nav-item mb-2"><a href="manage-lessons.html"
                            class="nav-link text-dark"><i
                                class="bi bi-play-btn me-2"></i> إدارة
                            الدروس</a></li>
                </ul>
            </div>
        </div>
        <div class="main-content p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold">إدارة دروس دوراتك</h3>
            </div>

            <div class="card border-0 shadow-sm overflow-hidden">
                <table class="table align-middle mb-0">
                    <thead class="bg-white">
                        <tr>
                            <th class="p-3 ">الدورة</th>
                            <th class="p-3">عدد الدروس</th>
                            <th class="p-3" >الإجراء</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>تعلم Laravel من الصفر</td>
                            <td>12 درس</td>
                            <td>
                                <a href="course-lessons.html"
                                    class="btn btn-sm btn-outline-info me-1">
                                    <i class="bi bi-list-task"></i> الدروس
                                </a>

                                <button
                                    class="btn btn-sm btn-outline-success me-1"
                                    data-bs-toggle="modal"
                                    data-bs-target="#addLessonModal">
                                    <i class="bi bi-plus-lg"></i> إضافة درس
                                </a>
                                <button class="btn btn-sm btn-outline-primary"
                                    data-bs-toggle="modal"
                                    data-bs-target="#editCourseModal">
                                    <i class="bi bi-pencil"></i>
                                </button>
                            </tr>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="modal fade" id="addLessonModal" tabindex="-1"
            aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border-0">
                    <div class="modal-header bg-success text-white">
                        <h5 class="modal-title">إضافة فيديو جديد</h5>
                        <button type="button"
                            class="btn-close btn-close-white ms-0"
                            data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body p-4 text-end">
                        <label class="form-label fw-bold">اسم الدرس</label>
                        <input type="text" class="form-control mb-3">
                        <label class="form-label fw-bold">ملف الفيديو</label>
                        <input type="file" class="form-control"
                            accept="video/*">
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-light"
                            data-bs-dismiss="modal">إلغاء</button>
                        <button type="button" class="btn btn-success">رفع
                            الدرس</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal fade" id="editCourseModal" tabindex="-1"
            aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border-0 shadow">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title fw-bold">تعديل بيانات الدورة</h5>
                        <button type="button"
                            class="btn-close btn-close-white ms-0"
                            data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body p-4 text-end">
                        <form>
                            <div class="mb-3">
                                <label class="form-label fw-bold">اسم
                                    الدورة</label>
                                <input type="text" class="form-control"
                                    value="اسم الدورة القديم">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">السعر</label>
                                <input type="number" class="form-control"
                                    value="150">
                            </div>
                            <button type="submit"
                                class="btn btn-primary w-100">حفظ
                                التعديلات</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="../assets/js/main.js"></script>
    </body>
</html>
