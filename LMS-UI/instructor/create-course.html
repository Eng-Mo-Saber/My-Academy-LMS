<!DOCTYPE html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>إنشاء دورة جديدة</title>
        <link rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
        <link rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
        <link rel="stylesheet" href="../assets/css/style.css">
    </head>
    <body class="bg-light">
        <div class="sidebar shadow-sm" id="sidebar">
            <div class="p-4 border-bottom text-center">
                <h5 class="fw-bold mb-0 text-primary">لوحة المدرب</h5>
            </div>
            <div class="p-3">
                <ul class="nav flex-column" id="sidebarNav">
                    <li class="nav-item mb-2"><a href="dashboard.html"
                            class="nav-link text-dark"><i
                                class="bi bi-grid-1x2 me-2"></i>
                            الإحصائيات</a></li>
                    <li class="nav-item mb-2"><a href="create-course.html"
                            class="nav-link text-dark"><i
                                class="bi bi-plus-square me-2"></i> إنشاء
                            دورة</a></li>
                    <li class="nav-item mb-2"><a href="manage-lessons.html"
                            class="nav-link text-dark"><i
                                class="bi bi-play-btn me-2"></i> إدارة
                            الدروس</a></li>
                </ul>
            </div>
        </div>
        <div class="main-content p-4">
            <h3 class="fw-bold mb-4 text-center">تفاصيل الدورة الجديدة</h3>
            <form>
                <div class="row g-4">
                    <div class="col-lg-8">
                        <div class="card border-0 shadow-sm p-4">
                            <label class="form-label fw-bold">عنوان
                                الدورة</label>
                            <input type="text" class="form-control mb-3"
                                placeholder="مثلاً: إتقان React JS">

                            <label class="form-label fw-bold">وصف قصير</label>
                            <textarea class="form-control mb-3"
                                rows="4"></textarea>

                            <label class="form-label fw-bold">ماذا سيتعلم
                                الطالب؟</label>
                            <textarea class="form-control" rows="3"
                                placeholder="نقطة في كل سطر"></textarea>
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <div class="card border-0 shadow-sm p-4 mb-4">
                            <label class="form-label fw-bold">صورة
                                الغلاف</label>
                            <input type="file" id="courseImg"
                                class="form-control mb-2">
                            <img id="imgPreview"
                                class="img-fluid rounded d-none">
                        </div>
                        <div class="card border-0 shadow-sm p-4 mb-4">
                            <label class="form-label fw-bold">السعر</label>
                            <input type="number" class="form-control"
                                placeholder="0.00">
                        </div>
                        <button type="submit"
                            class="btn btn-primary w-100 py-3 fw-bold">حفظ ونشر
                            الدورة</button>
                    </div>
                </div>
            </form>
        </div>
        <script src="../assets/js/main.js"></script>
    </body>
</html>
